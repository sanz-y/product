<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 로또 추첨기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>로또 번호 추첨</h1>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="테마 전환" title="다크/라이트 모드 전환">
                <span class="theme-icon" id="theme-icon">🌙</span>
                <span class="theme-text" id="theme-text">다크모드</span>
            </button>
        </div>
        <div id="lotto-container" class="ball-container">
            <!-- 번호 공이 여기에 생성됩니다 -->
            <div class="ball placeholder">?</div>
            <div class="ball placeholder">?</div>
            <div class="ball placeholder">?</div>
            <div class="ball placeholder">?</div>
            <div class="ball placeholder">?</div>
            <div class="ball placeholder">?</div>
        </div>
        <button id="draw-btn">번호 추첨하기</button>

        <hr class="divider">

        <div class="inquiry-section">
            <h2>🤝 제휴 및 문의</h2>
            <form id="contact-form" action="https://formspree.io/f/mvkpdlzv" method="POST">
                <div class="form-group">
                    <label for="name">이름 / 기업명</label>
                    <input type="text" id="name" name="name" placeholder="홍길동 또는 회사명" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="3" placeholder="제휴 내용이나 문의 사항을 입력해 주세요." required></textarea>
                </div>
                <button type="submit" id="submit-btn" class="submit-btn">문의 보내기</button>
                <div id="form-status" class="form-status"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
